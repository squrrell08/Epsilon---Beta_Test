<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3eb">
  <meta name="description" content="Epsilon is a small, welcoming corner of the internet. More to come soon.">
  <title>Epsilon</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252b25;background:#f6f3eb;font-synthesis:none;text-rendering:optimizeLegibility;scroll-behavior:smooth;--bg:#f6f3eb;--panel:#fffdf8;--panel2:#e9eee5;--line:#d6ddd2;--text:#252b25;--muted:#69756b;--accent:#42634d;--accent-soft:#42634d18}
    :root[data-theme="dark"]{--bg:#171a18;--panel:#222622;--panel2:#2b312c;--line:#414841;--text:#f0f0e9;--muted:#b0b7ad;--accent:#d5aa62;--accent-soft:#d5aa6218}
    :root[data-theme="light"]{--bg:#faf7ef;--panel:#fff;--panel2:#f0eadc;--line:#ded5c3;--text:#292820;--muted:#716d60;--accent:#9a6b27;--accent-soft:#9a6b2718}
    :root[data-theme="red"]{--bg:#f7eeee;--panel:#fff9f8;--panel2:#f1dfdd;--line:#e4c9c6;--text:#342625;--muted:#806664;--accent:#a13d3b;--accent-soft:#a13d3b18}
    :root[data-theme="blue"]{--bg:#edf3f7;--panel:#fbfdff;--panel2:#dce8f0;--line:#c8d8e3;--text:#24313a;--muted:#647985;--accent:#356d8d;--accent-soft:#356d8d18}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--text);transition:background .2s,color .2s}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}.shell{max-width:1060px;margin:auto;padding:0 6%}.header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:22px;position:relative;z-index:2}.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:650;letter-spacing:-.04em}.brand span{color:var(--accent);font-family:Georgia,serif;font-size:24px}.nav{display:flex;gap:24px}.nav a{font-size:13px;color:var(--muted)}.nav a:hover,.nav a.active{color:var(--text)}.menu{display:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;width:38px;height:38px}.menu span{display:block;width:15px;height:1px;background:var(--text);margin:4px auto}main{min-height:70vh;padding:54px 0 70px}.eyebrow{font:10px ui-monospace,monospace;letter-spacing:.11em;color:var(--muted)}.eyebrow span{color:var(--accent)}h1{font-size:clamp(42px,8vw,78px);letter-spacing:-.075em;font-weight:550;line-height:1;margin:22px 0}h2{font-size:clamp(25px,4vw,34px);letter-spacing:-.04em;margin:10px 0}.accent{color:var(--accent);font-family:Georgia,serif;font-style:italic}.lead{max-width:620px;color:var(--muted);font-size:16px;line-height:1.8}.hero{min-height:410px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;border-bottom:1px solid var(--line);padding:20px 0 40px}.hero-art{min-height:290px;display:grid;place-items:center;position:relative;background-image:linear-gradient(#42634d0c 1px,transparent 1px),linear-gradient(90deg,#42634d0c 1px,transparent 1px);background-size:35px 35px;mask-image:radial-gradient(ellipse,#000 20%,transparent 73%)}.planet{width:min(26vw,225px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 34% 29%,#f0ca78 0,#c18b36 30%,#785126 58%,#34291c 77%,var(--bg) 78%);box-shadow:inset -25px -20px 50px #08090955,0 0 65px #42634d22;animation:float 7s ease-in-out infinite}.planet span{font:italic clamp(75px,10vw,120px) Georgia;color:#fff4d7b5}.orbit{position:absolute;width:min(34vw,340px);aspect-ratio:1;border:1px solid #42634d30;border-radius:50%;transform:rotate(-25deg) scaleY(.42)}@keyframes float{50%{transform:translateY(-9px)}}.section{padding:38px 0}.panel{padding:24px;border:1px solid var(--line);border-radius:9px;background:linear-gradient(145deg,var(--panel),var(--panel2));margin-top:16px}.section p,.copy{color:var(--muted);font-size:14px;line-height:1.8}.page-title{font-size:clamp(38px,6vw,58px);margin:14px 0}.theme-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:20px}.theme-option{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-align:left}.theme-option.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft)}.swatches{display:flex;gap:4px}.swatches i{width:17px;height:17px;border-radius:50%;border:1px solid #8885}.theme-option strong{display:block;font-size:13px}.theme-option small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.theme-check{margin-left:auto;color:var(--accent)}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:19px 0;color:var(--muted);font-size:11px}
    @media(max-width:700px){.shell{padding:0 20px}.header{height:68px}.menu{display:block;order:3;flex:none}.nav{display:none;position:absolute;left:0;right:0;top:67px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:6px;flex-direction:column;gap:16px}.nav.open{display:flex}.hero{grid-template-columns:1fr;gap:8px;padding-top:20px}.hero-art{min-height:210px;grid-row:1}.planet{width:160px}.orbit{width:250px}.theme-options{grid-template-columns:1fr}.footer{align-items:flex-start;flex-direction:column}main{padding:36px 0 52px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="header"><a class="brand" href="#home" aria-label="Epsilon home"><span>ε</span> Epsilon</a><nav class="nav" aria-label="Main navigation"><a data-nav="home" href="#home">Home</a><a data-nav="changelog" href="#changelog">What’s new</a><a data-nav="settings" href="#settings">Settings</a></nav><button class="menu" aria-label="Toggle navigation" aria-expanded="false"><span></span><span></span></button></header>
    <main id="app"></main>
    <footer class="footer"><a class="brand" href="#home"><span>ε</span> Epsilon</a><span>A small corner of the internet. More to come.</span></footer>
  </div>
  <script>
    (()=>{
      const app=document.querySelector('#app'),nav=document.querySelector('.nav'),menu=document.querySelector('.menu'),themes=['green','dark','light','red','blue']
      const page=()=>location.hash.slice(1).toLowerCase()||'home'
      function setTheme(name){if(!themes.includes(name))name='green';document.documentElement.dataset.theme=name;try{localStorage.setItem('epsilon-theme',name)}catch{};const colors={green:'#f6f3eb',dark:'#171a18',light:'#faf7ef',red:'#f7eeee',blue:'#edf3f7'};document.querySelector('meta[name="theme-color"]').content=colors[name]}
      function home(){return `<section class="hero"><div><div class="eyebrow"><span>ε</span> &nbsp; A LITTLE SPACE TO PLAY</div><h1>Epsilon</h1><p class="lead">We’re taking a little time to figure out what comes next. Thanks for stopping by—we’re glad you’re here.</p></div><div class="hero-art" role="img" aria-label="A warm, golden planet with the Epsilon symbol"><div class="orbit"></div><div class="planet"><span>ε</span></div></div></section><section class="section"><h2>More soon.</h2><p>We’re giving Epsilon a fresh start. Check back later to see what we make of it.</p></section>`}
      function changelog(){return `<div class="eyebrow"><span>ε</span> &nbsp; WHAT’S NEW</div><h1 class="page-title">A fresh start.</h1><p class="lead">We’ve paused the games while we rethink the site. This is a clean slate, and we’ll share more here as things take shape.</p><section class="panel"><h2>For now</h2><p class="copy">There aren’t any games available at the moment. Thanks for bearing with us while Epsilon finds its next direction.</p></section>`}
      function settings(){let current='green';try{current=localStorage.getItem('epsilon-theme')||'green'}catch{}const options=[['green','Casino-table green','#f6f3eb','#42634d'],['dark','Dark','#171a18','#d5aa62'],['light','Light','#faf7ef','#9a6b27'],['red','Red','#f7eeee','#a13d3b'],['blue','Blue','#edf3f7','#356d8d']];return `<div class="eyebrow"><span>ε</span> &nbsp; YOUR PREFERENCES</div><h1 class="page-title">Make yourself at home.</h1><p class="lead">Pick the colors you like best. Your choice is saved in this browser.</p><section class="panel"><h2>Choose a theme</h2><p class="copy">Casino-table green is the default. You can switch things up any time.</p><div class="theme-options">${options.map(([id,name,bg,accent])=>`<button class="theme-option ${current===id?'selected':''}" data-theme-choice="${id}" aria-pressed="${current===id}"><span class="swatches"><i style="background:${bg}"></i><i style="background:${accent}"></i></span><span><strong>${name}</strong><small>${current===id?'You’re using this one':`Use the ${name.toLowerCase()} theme`}</small></span><span class="theme-check">${current===id?'✓':''}</span></button>`).join('')}</div></section>`}
      function render(){const current=page();document.querySelectorAll('[data-nav]').forEach(link=>link.classList.toggle('active',link.dataset.nav===current));document.title=current==='changelog'?'What’s new — Epsilon':current==='settings'?'Settings — Epsilon':'Epsilon';app.innerHTML=current==='changelog'?changelog():current==='settings'?settings():home();app.querySelectorAll('[data-theme-choice]').forEach(button=>button.addEventListener('click',()=>{setTheme(button.dataset.themeChoice);render()}))}
      let saved='green';try{saved=localStorage.getItem('epsilon-theme')||'green'}catch{}setTheme(saved)
      menu.addEventListener('click',()=>{const open=menu.getAttribute('aria-expanded')==='true';menu.setAttribute('aria-expanded',String(!open));nav.classList.toggle('open',!open)})
      nav.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>{menu.setAttribute('aria-expanded','false');nav.classList.remove('open')}))
      window.addEventListener('hashchange',render);render()
    })()
  </script>
</body>
</html>
